<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SARA AI LIVE — Virtual Host</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05060a;color:#fff;font-family:Inter,system-ui,sans-serif}
#app{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 20%,#32203b 0,#0b0d14 42%,#030407 100%)}
#avatar{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#05060a;display:none}
#avatar.on{display:block}
.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
.badge{background:#0b0e16dd;border:1px solid #2b3040;border-radius:999px;padding:10px 14px;backdrop-filter:blur(12px);font-size:13px}
#dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d6d;margin-right:7px}.onDot{background:#36d77a!important}
.bottom{position:absolute;left:18px;right:18px;bottom:18px;display:flex;justify-content:center;z-index:5;pointer-events:none}
#mic{max-width:720px;width:100%;text-align:center;background:#080b12e8;border:1px solid #2b3040;border-radius:16px;padding:12px 16px;backdrop-filter:blur(14px);font-size:14px}
#caption{position:absolute;left:50%;transform:translateX(-50%);bottom:92px;width:min(900px,calc(100% - 36px));text-align:center;background:#080b12d9;border:1px solid #2b3040;border-radius:16px;padding:14px 18px;line-height:1.6;z-index:5;display:none}
#caption.show{display:block}
#connect{position:absolute;right:18px;top:66px;z-index:6;border:1px solid #30364a;background:#0b0e16e8;color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
#connect:disabled{opacity:.7;cursor:default}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="badge">SARA AI • Virtual Host</div>
    <div class="badge"><span id="dot"></span><span id="status">Connecting…</span></div>
  </div>
  <button id="connect">Connect TikTok</button>
  <video id="avatar" autoplay playsinline></video>
  <div id="caption"></div>
  <div class="bottom"><div id="mic">SARA خود سننے کے لیے تیار ہو رہی ہے…</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const api=(p,o={})=>fetch(p,{...o,headers:{Accept:'application/json',...(o.headers||{})}});
let avatar=null,SDK=null,recognition=null,listening=false,autoListening=false,starting=false,busy=false;

function setStatus(text,good=false){$('status').textContent=text;$('dot').classList.toggle('onDot',good)}
function mic(text){$('mic').textContent=text}
function showCaption(text){$('caption').textContent=text;$('caption').classList.add('show');clearTimeout(showCaption.t);showCaption.t=setTimeout(()=>$('caption').classList.remove('show'),7000)}
function stopRecognition(){if(recognition&&listening){try{recognition.stop()}catch{}}}
function startRecognition(){
  if(!autoListening||!recognition||listening||starting||busy)return;
  starting=true;try{recognition.lang='ur-PK';recognition.start()}catch{}finally{setTimeout(()=>starting=false,250)}
}
function setupRecognition(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){mic('اس Chrome میں voice recognition available نہیں ہے۔');return false}
  recognition=new SR();
  recognition.continuous=true;recognition.interimResults=false;recognition.lang='ur-PK';recognition.maxAlternatives=1;
  recognition.onstart=()=>{listening=true;mic('🎤 SARA سن رہی ہے — آپ بات کریں۔')}
  recognition.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal){
        const text=e.results[i][0].transcript.trim();
        if(text)talk(text);
      }
    }
  };
  recognition.onerror=e=>{
    listening=false;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){mic('Microphone کی اجازت Allow کریں؛ پھر SARA خود سننا شروع کرے گی۔');return}
    setTimeout(startRecognition,1000)
  };
  recognition.onend=()=>{listening=false;if(autoListening&&!busy)setTimeout(startRecognition,600)}
  return true
}
async function talk(text){
  if(!text||busy||!avatar)return;
  busy=true;stopRecognition();setStatus('SARA سوچ رہی ہے…',true);showCaption(text);
  try{
    const r=await api('/api/sara/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,language:'ur'})});
    const x=await r.json();
    if(!r.ok)throw Error(x.error||'SARA response failed');
    showCaption(x.reply||'');
    setStatus('SARA بول رہی ہے…',true);
    if(x.audioBase64&&typeof avatar.repeatAudio==='function'){avatar.repeatAudio(x.audioBase64)}else if(typeof avatar.repeat==='function'){await avatar.repeat(x.reply||'')}
  }catch(e){showCaption('معذرت، ابھی جواب دینے میں مسئلہ آ رہا ہے۔');mic('SARA backend error: '+e.message)}
  finally{busy=false;setStatus('SARA LIVE',true);mic('🎤 SARA سن رہی ہے — آپ بات کریں۔');setTimeout(startRecognition,700)}
}
async function startAvatar(){
  try{
    setStatus('Real female avatar connecting…');
    const r=await api('/api/liveavatar/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({isSandbox:false})});
    const x=await r.json();
    if(!r.ok)throw Error(x.error||'LiveAvatar connection failed');
    if(!x.session_token)throw Error('LiveAvatar نے session token نہیں دیا۔');
    SDK=await import('https://esm.sh/@heygen/liveavatar-web-sdk@0.0.19');
    avatar=new SDK.LiveAvatarSession(x.session_token,{autoKeepAlive:true});
    avatar.on(SDK.SessionEvent.SESSION_STREAM_READY,async()=>{
      $('avatar').srcObject=null;
      avatar.attach($('avatar'));
      $('avatar').classList.add('on');
      await $('avatar').play().catch(()=>{});
      setStatus('SARA LIVE',true);
      mic('🎤 SARA سن رہی ہے — آپ بات کریں۔');
    });
    avatar.on(SDK.AgentEventsEnum.AVATAR_SPEAK_STARTED,()=>{setStatus('SARA بول رہی ہے…',true)});
    avatar.on(SDK.AgentEventsEnum.AVATAR_SPEAK_ENDED,()=>{setStatus('SARA LIVE',true);setTimeout(startRecognition,500)});
    avatar.on(SDK.SessionEvent.SESSION_DISCONNECTED,()=>{
      avatar=null;$('avatar').classList.remove('on');setStatus('Reconnecting…');setTimeout(startAvatar,2500)
    });
    await avatar.start();
  }catch(e){avatar=null;setStatus('LiveAvatar error');mic('Real female avatar connect نہیں ہوا: '+e.message)}
}
async function enableMic(){
  autoListening=true;
  if(!setupRecognition())return;
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());
    startRecognition();
  }catch(e){mic('Microphone کی اجازت دیں؛ اس کے بعد SARA خود سننے لگے گی۔')}
}
async function checkHealth(){
  try{
    const r=await api('/api/health');const x=await r.json();
    if(!x.liveAvatarConfigured)mic('LiveAvatar کے لیے Vercel میں LIVEAVATAR_API_KEY اور LIVEAVATAR_AVATAR_ID درکار ہیں۔');
    return x
  }catch{mic('SARA backend available نہیں ہے۔')}
}
async function checkTikTok(){
  try{const x=await(await api('/api/me')).json();if(x.authenticated){$('connect').textContent='TikTok Connected';$('connect').disabled=true}}catch{}
}
$('connect').onclick=()=>location.href='/auth/tiktok';
(async()=>{
  const h=await checkHealth();await checkTikTok();
  if(h?.liveAvatarConfigured)await startAvatar();
  await enableMic();
})();
</script>
</body>
</html>
