services:
  - type: web
    name: sara-live
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server-bootstrap.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SARA_ALLOWED_ORIGINS
        value: "https://muhammadlai.github.io,http://localhost:3000,http://127.0.0.1:3000"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: VOICE_PROVIDER
        value: elevenlabs
      - key: VOICE_API_KEY
        sync: false
      - key: VOICE_ID
        sync: false
      - key: LIVEAVATAR_API_KEY
        sync: false
      - key: LIVEAVATAR_AVATAR_ID
        sync: false
      - key: LIVEAVATAR_IS_SANDBOX
        value: "false"
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        value: "https://sara-live.onrender.com/auth/tiktok/callback"
      - key: TIKTOK_SCOPES
        value: user.info.basic
      - key: SARA_MAX_QUEUE
        value: "20"
      - key: SARA_AUDIO_TTL_MS
        value: "600000"
      - key: SARA_MESSAGE_COOLDOWN_MS
        value: "1200"
      - key: TIKTOK_LIVE_USERNAME
        sync: false
      - key: TIKTOK_LIVE_SIGN_API_KEY
        sync: false
      - key: SARA_AUTO_REPLY_LIVE
        value: "true"
      - key: SARA_EVENT_INGEST_KEY
        sync: false
